<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Sky & Background Gradients -->
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120805"/>
      <stop offset="50%" stop-color="#2C1A14"/>
      <stop offset="100%" stop-color="#8C381E" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Warm Architecture Glow -->
    <radialGradient id="portalGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#F7F3E9" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#E5A93B" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#C85A32" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#180D09" stop-opacity="0"/>
    </radialGradient>

    <!-- Athangudi Tile Pattern -->
    <pattern id="athangudiPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#180D09"/>
      <path d="M 0 50 L 50 0 L 100 50 L 50 100 Z" fill="none" stroke="#C68B34" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="#C85A32" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Sky -->
  <rect width="1920" height="1080" fill="url(#duskSky)"/>

  <!-- Light Portal from Mansion Courtyard -->
  <circle cx="960" cy="620" r="450" fill="url(#portalGlow)"/>

  <!-- Chettinad Mansion Façade Structure -->
  <!-- Roof Tile Eaves -->
  <polygon points="160,340 960,180 1760,340 1700,380 960,230 220,380" fill="#8C381E" stroke="#C85A32" stroke-width="2"/>
  <polygon points="260,420 960,290 1660,420 1620,450 960,330 300,450" fill="#2C1A14" stroke="#C68B34" stroke-width="1.5"/>

  <!-- Upper Balcony Windows & Louvers -->
  <rect x="420" y="440" width="180" height="160" fill="#180D09" stroke="#C68B34" stroke-width="3"/>
  <rect x="680" y="440" width="180" height="160" fill="#180D09" stroke="#C68B34" stroke-width="3"/>
  <rect x="1060" y="440" width="180" height="160" fill="#180D09" stroke="#C68B34" stroke-width="3"/>
  <rect x="1320" y="440" width="180" height="160" fill="#180D09" stroke="#C68B34" stroke-width="3"/>

  <!-- Upper Balcony Decorative Pillars -->
  <rect x="380" y="420" width="24" height="200" fill="#C68B34"/>
  <rect x="640" y="420" width="24" height="200" fill="#C68B34"/>
  <rect x="900" y="420" width="24" height="200" fill="#C68B34"/>
  <rect x="996" y="420" width="24" height="200" fill="#C68B34"/>
  <rect x="1256" y="420" width="24" height="200" fill="#C68B34"/>
  <rect x="1516" y="420" width="24" height="200" fill="#C68B34"/>

  <!-- Main Ground Floor Verandah Platform (Thinnai) -->
  <rect x="200" y="620" width="1520" height="340" fill="#2C1A14" stroke="#8C381E" stroke-width="3"/>
  <rect x="220" y="920" width="1480" height="160" fill="url(#athangudiPattern)"/>

  <!-- Carved Burma Teak Main Pillars -->
  <g id="pillars">
    <!-- Pillar 1 -->
    <rect x="320" y="620" width="48" height="300" fill="#3D2319" stroke="#C68B34" stroke-width="2"/>
    <rect x="304" y="900" width="80" height="24" fill="#C68B34"/>
    <!-- Pillar 2 -->
    <rect x="580" y="620" width="48" height="300" fill="#3D2319" stroke="#C68B34" stroke-width="2"/>
    <rect x="564" y="900" width="80" height="24" fill="#C68B34"/>
    <!-- Pillar 3 -->
    <rect x="840" y="620" width="48" height="300" fill="#3D2319" stroke="#C68B34" stroke-width="2"/>
    <rect x="824" y="900" width="80" height="24" fill="#C68B34"/>
    <!-- Pillar 4 -->
    <rect x="1032" y="620" width="48" height="300" fill="#3D2319" stroke="#C68B34" stroke-width="2"/>
    <rect x="1016" y="900" width="80" height="24" fill="#C68B34"/>
    <!-- Pillar 5 -->
    <rect x="1292" y="620" width="48" height="300" fill="#3D2319" stroke="#C68B34" stroke-width="2"/>
    <rect x="1276" y="900" width="80" height="24" fill="#C68B34"/>
    <!-- Pillar 6 -->
    <rect x="1552" y="620" width="48" height="300" fill="#3D2319" stroke="#C68B34" stroke-width="2"/>
    <rect x="1536" y="900" width="80" height="24" fill="#C68B34"/>
  </g>

  <!-- Central Stately Entrance Doorframe & Arch -->
  <path d="M 860 920 L 860 680 Q 960 620 1060 680 L 1060 920 Z" fill="#100704" stroke="#D4AF37" stroke-width="4"/>
  <path d="M 880 920 L 880 700 Q 960 650 1040 700 L 1040 920 Z" fill="#F7F3E9" opacity="0.95"/>
  <!-- Door Panels -->
  <rect x="880" y="700" width="76" height="220" fill="#2C1A14" stroke="#8C381E" stroke-width="2"/>
  <rect x="964" y="700" width="76" height="220" fill="#2C1A14" stroke="#8C381E" stroke-width="2"/>
  <circle cx="950" cy="810" r="6" fill="#D4AF37"/>
  <circle cx="970" cy="810" r="6" fill="#D4AF37"/>

  <!-- Architectural Labels -->
  <text x="960" y="1020" text-anchor="middle" fill="#F7F3E9" font-family="serif" font-size="28" font-weight="600" letter-spacing="6">
    KANADUKATHAN GRAND MANSION
  </text>
  <text x="960" y="1050" text-anchor="middle" fill="#C68B34" font-family="sans-serif" font-size="16" letter-spacing="4" opacity="0.85">
    AUTHENTIC CHETTINAD HERITAGE ARCHITECTURE
  </text>
</svg>
