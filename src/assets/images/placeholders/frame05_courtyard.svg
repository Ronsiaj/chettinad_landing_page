<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <rect width="1920" height="1080" fill="#1A0E0A"/>
  <!-- Open-to-sky Skylight Cutout -->
  <polygon points="460,80 1460,80 1340,460 580,460" fill="#F7F3E9" opacity="0.95"/>
  <polygon points="460,80 1460,80 1660,1000 260,1000" fill="url(#sunlight2)" opacity="0.45"/>
  
  <linearGradient id="sunlight2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF5E1"/>
    <stop offset="100%" stop-color="#C68B34" stop-opacity="0"/>
  </linearGradient>

  <!-- Courtyard Perimeter Granite Columns & Tiled Floor -->
  <rect x="240" y="460" width="1440" height="540" fill="#2C1A14" stroke="#8C381E" stroke-width="6"/>
  <rect x="300" y="780" width="1320" height="200" fill="#180D09" stroke="#C68B34" stroke-width="3"/>

  <text x="960" y="280" text-anchor="middle" fill="#180D09" font-family="Cinzel, serif" font-size="38" font-weight="700" letter-spacing="8">
    VALAVU — CENTRAL COURTYARD
  </text>
  <text x="960" y="860" text-anchor="middle" fill="#F7F3E9" font-family="Cinzel, serif" font-size="28" letter-spacing="6">
    A HOUSE BUILT AROUND COURTYARDS
  </text>
  <text x="960" y="905" text-anchor="middle" fill="#C68B34" font-family="sans-serif" font-size="18" letter-spacing="4">
    FRAME 05 — COURTYARD SPACE
  </text>
</svg>
